evidence:
  FAO56: "Allen, R.G., Pereira, L.S., Raes, D., Smith, M. (1998). Crop Evapotranspiration. FAO Irrigation and Drainage Paper 56."
  RALLO2021: "Rallo, G. et al. (2021). Updated single and dual crop coefficients for tree and vine fruit crops. Agricultural Water Management 250, 106645."
  UCD_SWP: "Shackel, K. et al. Stem water potential baseline. UC ANR Publication 8503."
  IRTA_RDI: "Girona, J. et al. (IRTA). Regulated deficit irrigation in almond during kernel filling."
  IRTA_RDI_VAIRO: "Girona, J. et al. (IRTA). Vairo regulated deficit irrigation trials (stem water potential -1.5 and -2.0 MPa)."
  CDFA_UC: "CDFA / UC. Almond Fertilization Guidelines (nutrient removal, leaf standards, nitrogen timing)."
  FAO_SALT: "FAO (2002). Agricultural Drainage Water Management in Arid and Semi-Arid Areas, Annex 1 (crop salt tolerance table)."
  SAUNIER1960: "Saunier (1960), cited in Gil Albert (1986). Critical frost temperatures for almond by stage."
  CALLE2025: "Calle et al. (2025). J. Agron. Crop Sci. 211:e70090 (IRTA, Lleida), Fig. 3, full bloom (Felipe stage F), combined 2016 and 2019. Cut branches held at the target temperature for 30 minutes in a chamber."
  UCIPM_NOW: "UC IPM Almond Pest Management Guidelines: Navel orangeworm."
  UCIPM_PTB: "UC IPM Almond Pest Management Guidelines: Peach twig borer."
  UCIPM_RLB: "UC IPM Almond Pest Management Guidelines: Red leaf blotch."
  ALMOND_DOCTOR_DSV: "Doll, D. The Almond Doctor: Alternaria DSV model. With UC IPM Almond Pest Management Guidelines: Alternaria leaf spot."
  IRTA_VAIRO: "IRTA. Variedades de almendro (Vairo)."
  CEBAS_MAKAKO: "CEBAS-CSIC. 'Makako': a new extra-late flowering self-compatible cultivar."
  BBCH_STONE: "Meier, U. et al. (1994). BBCH phenological growth stages of stone fruit. As named in the CDSS specification v3.0, C3; full reference to be confirmed."
  EXPERT_OPERATIONAL: "Operational estimate from the CDSS specification v3.0; no published source."
